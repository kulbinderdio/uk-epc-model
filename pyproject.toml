[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epc-model"
version = "0.1.0"
description = "EPC rating prediction model and web API"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "lightgbm>=4.5.0",
    "optuna>=3.6.0",
    "shap>=0.46.0",
    "scikit-learn>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "pyarrow>=17.0.0",
    "joblib>=1.4.0",
    "huggingface-hub>=1.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
